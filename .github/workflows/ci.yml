name: Verificação e build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Validar aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar estrutura e assets
        run: npm run check
      - name: Compilar para produção
        run: npm run build
